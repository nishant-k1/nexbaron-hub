<!doctype html>
<html lang="en" data-theme="dark" data-division="digital">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-digital.svg" id="favicon" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1a1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexbaron Hub" />
    <title>Nexbaron Hub</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
  <body>
    <script>
      try {
        const t = localStorage.getItem("nexbaron-hub-theme")
        if (t === "light") document.documentElement.setAttribute("data-theme", "light")
      } catch {}
      // Brand favicon + division theme
      const isPrint = window.location.pathname.startsWith("/print")
      document.getElementById("favicon").href = "/favicon-" + (isPrint ? "print" : "digital") + ".svg"
      document.documentElement.setAttribute("data-division", isPrint ? "print" : "digital")
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
